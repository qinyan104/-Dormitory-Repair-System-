  <rect x="40" y="100" width="260" height="40" rx="6" fill="rgba(20,20,19,0.03)" stroke="none"/>
  <line x1="40" y1="140" x2="300" y2="140" stroke="rgba(20,20,19,0.15)" stroke-width="1.2"/>
