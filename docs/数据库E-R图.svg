  <text class="entity-title" x="56" y="132" fill="#141413">sys_user</text>
  <!-- Fields -->
  <text class="field-name" x="56" y="176" fill="#141413"># id</text>
  <text class="field-type" x="284" y="176" fill="#696969" text-anchor="end">BIGINT (PK)</text>
  <text class="field-name" x="56" y="204" fill="#141413">username</text>
