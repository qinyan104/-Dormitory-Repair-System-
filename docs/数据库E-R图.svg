  <text class="field-type" x="284" y="428" fill="#696969" text-anchor="end">VARCHAR(255)</text>
  <text class="field-name" x="56" y="456" fill="#141413">role</text>
  <text class="field-type" x="284" y="456" fill="#696969" text-anchor="end">VARCHAR(20)</text>
