  <rect x="360" y="340" width="300" height="40" rx="6" fill="rgba(207,69,0,0.12)" stroke="none"/>
  <line x1="360" y1="380" x2="660" y2="380" stroke="rgba(207,69,0,0.30)" stroke-width="1.2"/>
