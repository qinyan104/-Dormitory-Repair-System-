<svg viewBox="0 0 1020 1160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .eyebrow-text { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: bold; letter-spacing: 0.14em; text-transform: uppercase; }
    .entity-title { font-family: 'Microsoft YaHei', -apple-system, sans-serif; font-size: 17px; font-weight: bold; }
    .field-name { font-family: Consolas, 'Courier New', monospace; font-size: 13px; font-weight: bold; }
    .field-type { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; }
    .cardinality-text { font-family: Consolas, 'Courier New', monospace; font-size: 13.5px; font-weight: bold; }
    .relation-label { font-family: Consolas, 'Courier New', monospace; font-size: 12px; font-weight: bold; letter-spacing: 0.08em; }
    .legend-title { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.14em; }
    .legend-text { font-family: 'Microsoft YaHei', -apple-system, sans-serif; font-size: 12.5px; }
  </style>

  <defs>
    <!-- Dot pattern for dotted paper background -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(20,20,19,0.06)"/>
    </pattern>
  </defs>

  <!-- Dotted background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- ==================== RELATIONSHIPS ==================== -->
  
  <!-- 1. Category — Order (1:N, vertical) -->
  <line x1="510" y1="312" x2="510" y2="340" stroke="#696969" stroke-width="1.5"/>

  <!-- 2. User — Order (1:N, orthogonal) -->
  <path d="M 300,316 L 330,316 L 330,444 L 360,444" fill="none" stroke="#696969" stroke-width="1.5"/>

  <!-- 3. Order — Feedback (1:0..1, orthogonal) -->
  <path d="M 660,416 L 690,416 L 690,292 L 720,292" fill="none" stroke="#696969" stroke-width="1.5"/>


  <!-- ==================== CARDINALITY LABELS ==================== -->

  <!-- Category - Order Cardinality -->
  <text class="cardinality-text" x="518" y="322" fill="#696969">1</text>
  <text class="cardinality-text" x="518" y="334" fill="#696969">N</text>
  
  <!-- User - Order Cardinality -->
  <text class="cardinality-text" x="312" y="310" fill="#696969">1</text>
  <text class="cardinality-text" x="348" y="438" fill="#696969">N</text>

  <!-- Order - Feedback Cardinality -->
  <text class="cardinality-text" x="672" y="410" fill="#696969">1</text>
  <text class="cardinality-text" x="692" y="286" fill="#696969">0..1</text>


  <!-- ==================== RELATIONSHIP LABELS ==================== -->

  <!-- Category -> Order label -->
  <rect x="494" y="315" width="32" height="14" rx="2" fill="#FFFFFF"/>
  <text class="relation-label" x="510" y="325" fill="#696969" text-anchor="middle">归属</text>

  <!-- User -> Order label -->
  <rect x="314" y="373" width="32" height="14" rx="2" fill="#FFFFFF"/>
  <text class="relation-label" x="330" y="383" fill="#696969" text-anchor="middle">提交</text>

  <!-- Order -> Feedback label -->
  <rect x="674" y="347" width="32" height="14" rx="2" fill="#FFFFFF"/>
  <text class="relation-label" x="690" y="357" fill="#696969" text-anchor="middle">评价</text>


