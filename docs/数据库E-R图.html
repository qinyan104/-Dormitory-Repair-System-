<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍报修管理系统 - 数据库E-R图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #FFFFFF;   /* Pure White */
      --color-paper-2:     #FFFFFF;   /* Pure White */
      --color-ink:         #141413;   /* Ink Black */
      --color-muted:       #696969;   /* Slate Gray */
      --color-soft:        #A3A3A3;
      --color-rule:        rgba(20,20,19,0.10);
      --color-rule-solid:  #D1CDC7;
      --color-accent:      #CF4500;   /* Signal Orange */
      --color-accent-tint: rgba(207,69,0,0.08);
      --color-link:        #3860BE;   /* Link Blue */
      --font-sans:         'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:        'Instrument Serif', serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .frame {
      width: 100%;
      max-width: 1100px;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 8px;
      padding: 2.5rem 2rem;
    }

    svg { width: 100%; display: block; background: transparent; }

    /* SVG Text Styling */
    svg text { user-select: none; }
    svg .eyebrow-text { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    svg .entity-title { font-family: var(--font-sans); font-size: 17px; font-weight: 600; }
    svg .field-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
    svg .field-type { font-family: var(--font-mono); font-size: 11.5px; }
    svg .cardinality-text { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; }
    svg .relation-label { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; }
    svg .legend-title { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; }
    svg .legend-text { font-family: var(--font-sans); font-size: 12.5px; }
  </style>
</head>
<body>
